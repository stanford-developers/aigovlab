<footer>
  <div class="wrap footer-inner">
    <div class="footer-logos">
      <a href="https://hai.stanford.edu/" target="_blank" rel="noopener"><img src="{{ '/assets/img/hai-logo.png' | relative_url }}" alt="Stanford Institute for Human-Centered Artificial Intelligence" class="footer-logo footer-logo-hai" width="466" height="96" loading="lazy"></a>
      <a href="https://law.stanford.edu/" target="_blank" rel="noopener"><img src="{{ '/assets/img/sls-logo.png' | relative_url }}" alt="Stanford Law School" class="footer-logo footer-logo-sls" width="300" height="45" loading="lazy"></a>
    </div>
    <div class="footer-identity">
      <p class="footer-name">{{ site.title }} {{ site.subtitle }}</p>
      {%- comment -%}
        The year comes from the build time rather than being typed in, so it
        cannot quietly go stale — every push to main rebuilds the site.
      {%- endcomment -%}
      <p class="footer-copyright">&copy; {{ site.time | date: "%Y" }}</p>
    </div>
    <p class="footer-links">
      <a href="{{ site.substack_url }}" target="_blank" rel="noopener">Substack</a>
      <a href="https://www.stanford.edu/accessibility">Accessibility</a>
    </p>
  </div>
</footer>
