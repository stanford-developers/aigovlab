# Publications and working papers, shown on the Research page.
#
# Add one block per paper, newest first — this file's order is the page's order.
# While the file is empty the page shows a "check back soon" message.
#
#   title       the paper's title
#   authors     list of names, in the order they appear on the paper; names
#               matching someone in people.yml are bolded automatically
#   year        publication year
#   venue       journal, conference, or "Working paper" — omit if unpublished
#   details     volume/issue/pages, or a status note like "Conditionally accepted"
#   links       any of: pdf, doi, url, code, data — each a full URL. The title
#               links to the doi (or else the url, or else the pdf); the rest
#               show as small links underneath. Leave out the ones that don't apply
#
# Copy this shape:
#
# - title: "The paper's title"
#   authors: ["Jane Doe", "John Roe"]
#   year: 2026
#   venue: "Journal Name"
#   details: "12(3): 145–170"
#   links:
#     pdf: "https://example.org/paper.pdf"
#     doi: "https://doi.org/10.0000/example"

