# Events on the homepage calendar — the lab's own, and ones worth attending
# elsewhere.
#
# Add one block per event, in any order; the section sorts them by date and
# drops them once the day has passed. Events this month and next also show up
# on the two small calendars. While nothing is upcoming, the section shows a
# "nothing on the calendar yet" message instead.
#
#   date      YYYY-MM-DD
#   title     what the event is called
#   host      who is putting it on, which sets its color on the calendar:
#               lab          the AI Governance Lab (the default if left out)
#               hai          Stanford HAI
#               sls          Stanford Law School
#               recommended  someone else's event the lab thinks is worth going to
#   time      free text, e.g. "4:00–5:30 pm" — optional
#   location  room, building, or "Online" — optional
#   summary   a sentence on what it is — optional
#   url       a registration or details page — optional
#
# Copy this shape:
#
# - date: 2026-10-08
#   title: "Workshop: Auditing frontier models"
#   host: lab
#   time: "12:00–1:30 pm"
#   location: "Encina Hall, Stanford"
#   summary: "A half-day session on what third-party model audits can and cannot establish."
#   url: "https://example.com/register"

