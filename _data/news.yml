# Press coverage and lab announcements, shown in the News section of the homepage.
#
# Add one block per item, newest first — this file's order is the section's
# order. While the file is empty the section shows a "check back soon" message.
#
#   date     YYYY-MM-DD; only the month and year are displayed
#   outlet   publication or venue name
#   title    the headline, or a one-line description of the item
#   summary  a sentence on why it matters to the lab — optional
#   url      where it links to
#   more_url, more_label   a second link after the summary — optional
#   quote, quote_by        a pull quote shown under the summary — optional
#
# Copy this shape:
#
# - date: 2026-08-14
#   outlet: "The New York Times"
#   title: "The headline of the story"
#   summary: "What the story means for the lab."
#   url: "https://example.com/story"

- date: 2026-11-18
  outlet: "Office of Governor Gavin Newsom"
  title: "California Expert Panel Report: Recommendations for Legislative Enhancements to California’s AI Safety Laws"
  summary: "Co-authored by Co-Director Rob Reich, the expert panel’s report provides California policymakers with a range of recommendations to effectively implement recent legislation on AI."
  url: "https://www.gov.ca.gov/2026/11/18/governor-newsoms-nation-leading-ai-safety-framework-is-getting-even-stronger-as-california-releases-next-steps-on-mandatory-safety-standards-and-oversight/"
  more_url: "https://www.govops.ca.gov/wp-content/uploads/sites/11/2026/11/FINAL_-AI-Safety-in-2026-and-Beyond-v2.pdf"
  more_label: "Full report here"
  quote: "Today there is more oversight of the cafeteria offering sandwiches to employees at a frontier AI developer than of the AI models they design. It’s time to govern this technology so that we can build public trust and support responsible innovation. I’m proud to see California leading the way. From confronting the risks from recursive self improvement to critical incident reporting to independent testing and evaluation, the recommendations in this report urge the state, and policymakers elsewhere, to take commonsense action without diminishing the extraordinary benefits from AI."
  quote_by: "Rob Reich"

- date: 2026-11-10
  outlet: "WIRED"
  title: "The AI Safety Debate Has Lost the Plot. We Asked 10 Experts What the Real Nightmares Are"
  summary: "Co-Director Rob Reich is featured as a leading voice in responsible AI and shares his views on what we should and shouldn’t be concerned with regarding AI. He also challenges the common refrain from the tech leaders to “democratize” AI without having a vision for meaningful democratic governance."
  url: "https://www.wired.com/story/the-ai-safety-debate-has-lost-the-plot-we-asked-10-experts-what-the-real-nightmares-are/"

