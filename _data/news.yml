# Press coverage and lab announcements, shown in the News section of the homepage.
#
# Add one block per item, newest first — this file's order is the section's
# order. While the file is empty the section shows a "check back soon" message.
#
#   date     YYYY-MM-DD; only the month and year are displayed
#   outlet   publication or venue name
#   title    the headline, or a one-line description of the item
#   summary  a sentence on why it matters to the lab — optional
#   url      where it links to
#
# Copy this shape:
#
# - date: 2026-08-14
#   outlet: "The New York Times"
#   title: "The headline of the story"
#   summary: "What the story means for the lab."
#   url: "https://example.com/story"

- date: 2026-09-23
  outlet: "Office of Governor Gavin Newsom"
  title: "Governor Newsom announces world-leading experts to deliver on his AI executive order, including advancing creation of a “kill switch”"
  summary: "AI Governance Lab Co-Director Rob Reich was named to the advisory council for the executive order, which accelerates independent oversight of AI."
  url: "https://www.gov.ca.gov/2026/09/23/governor-newsom-announces-world-leading-experts-to-deliver-on-his-ai-executive-order-including-advancing-creation-of-a-kill-switch/"
