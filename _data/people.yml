# Everyone in the People section of the homepage. To add someone, copy a block
# and fill it in — no HTML required.
#
#   name           displayed name. Prefix "Dr." for a doctorate holder whose
#                  `role` does not already name a professorship — the faculty
#                  directors' titles carry the credential, a postdoc's do not.
#   last_name      the part of the name to alphabetize by; each group is sorted
#                  by this, so it is required even when it looks redundant
#   role           title shown under the name. For the faculty directors this
#                  is their professorship, not their lab position — the
#                  "Co-Directors" group heading already says that.
#   group          which section they appear in; see _data/people_groups.yml
#                  (faculty | staff | members | alumni)
#   photo          filename inside assets/img/ — omit for a blank avatar circle.
#                  Crop it square with the eyes centered 40% of the way down
#                  and the face (chin to hairline) about half the frame, so
#                  eyelines stay level with everyone else's. 400×400 JPEG.
#   url            their faculty or personal page; the whole card becomes a
#                  link to it. Omit and the card renders as plain text. On a
#                  profile page it is the "Website" link.
#   linkedin       full LinkedIn URL, shown under the photo on a profile page.
#   portrait       optional 4:5 photo, 640×800, for the profile
#                  page, which has room to show more than the face. Falls
#                  back to `photo`.
#
# To give someone a profile page with a bio, add _people/<their-name>.md; see
# _people/yasi-khan.md. Their homepage card then links there instead of `url`.

