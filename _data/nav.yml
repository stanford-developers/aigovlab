# Top-nav tabs, in the order they appear. Add a tab here and it shows up on
# every page.
#
#   id       matched against each page's `nav:` front matter to mark the active
#            tab; for homepage sections it must equal the section's HTML id
#   label    the visible text
#   url      "/#section" for a homepage section, "/page.html" for its own page
#   section  true if this scrolls to a part of the homepage rather than loading
#            a new page (drives the scroll highlighting)
#
# The homepage's sections are laid out in this same order, so the highlighted
# tab moves left to right as you scroll. Reorder a section tab here and move
# its <section> in index.html to match.
- id: home
  label: Home
  url: /#home
  section: true
- id: people
  label: People
  url: /#people
  section: true
- id: news
  label: News
  url: /#news
  section: true
- id: events
  label: Events
  url: /#events
  section: true
- id: research
  label: Research
  url: /research.html
- id: teaching
  label: Teaching
  url: /teaching.html
- id: substack
  label: Stay in Touch
  url: /#substack
  section: true
